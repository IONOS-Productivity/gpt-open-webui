name: open-webui-dev

services:

  postgresql:
    image: pgvector/pgvector:pg17
    command: ["-h", "0.0.0.0"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: postgres
    network_mode: host
    ports:
      - "5432:5432"
    volumes:
      - ./initdb.d/custom_init.sql:/docker-entrypoint-initdb.d/custom_init.sql
      - pgdata:/var/lib/postgresql/data
  adminer:
    image: adminer
    ports:
      - "8081:8080"

  frontend:
    build:
      context: .
      target: build
    command: ["sh", "/app/src/frontend-dev.sh"]
    env_file: ".env"
    depends_on:
      - backend
    ports:
      - "3000:5173"
    extra_hosts:
      - host.docker.internal:127.0.0.1
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./static/assets:/app/static/assets
      - ./static/avatars:/app/static/avatars
      - ./static/data:/app/static/data
      - ./static/favicon:/app/static/favicon
      - ./static/static:/app/static/static
      - ./vite.config.ts:/app/vite.config.ts
      - ./svelte.config.js:/app/svelte.config.js
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.ionos.json:/app/tsconfig.ionos.json
      - ./tailwind.config.js:/app/tailwind.config.js

  backend:
    build:
      context: .
      target: base
    command: ["bash", "dev.sh"]
    env_file: ".env"
    environment:
      - ENV=dev
    network_mode: host
    ports:
      - "8080:8080"
    extra_hosts:
      - host.docker.internal:127.0.0.1
    volumes:
      - ./backend:/app/backend
      - data:/app/backend/data

