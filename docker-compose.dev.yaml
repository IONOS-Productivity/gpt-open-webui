name: open-webui-dev

# SQL custom_init.sql >
# CREATE DATABASE openwebui_vector;
# \c openwebui_vector
# CREATE EXTENSION vector;


services:

#  postgresql:
#    image: pgvector/pgvector:pg17
#    environment:
#      POSTGRES_USER: postgres
#      POSTGRES_PASSWORD: pass
#      POSTGRES_DB: postgres
#    ports:
#      - "5432:5432"
#    volumes:
#      - ./initdb.d/custom_init.sql:/docker-entrypoint-initdb.d/custom_init.sql
#      - pgdata:/var/lib/postgresql/data


  frontend:
    build:
      context: .
      target: build
    command: ["sh", "/app/src/frontend-dev.sh"]
    env_file: ".env"
    env:
      - NODE_OPTIONS=--max-old-space-size=3300
    depends_on:
      - backend
    ports:
      - "3000:5173"
    extra_hosts:
      - host.docker.internal:127.0.0.1
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./static/assets:/app/static/assets
      - ./static/avatars:/app/static/avatars
      - ./static/data:/app/static/data
      - ./static/favicon:/app/static/favicon
      - ./static/static:/app/static/static
      - ./vite.config.ts:/app/vite.config.ts
      - ./svelte.config.js:/app/svelte.config.js
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.ionos.json:/app/tsconfig.ionos.json
      - ./tailwind.config.js:/app/tailwind.config.js

  backend:
    build:
      context: .
      target: base
    command: ["bash", "dev.sh"]
    env_file: ".env"
    environment:
      - ENV=dev
      - RUN_MIGRATIONS=true
    depends_on:
      - chromadb
      - storage
    network_mode: host
    ports:
      - "8080:8080"
    extra_hosts:
      - host.docker.internal:127.0.0.1
    volumes:
      - ./backend:/app/backend
      - data:/app/backend/data
    depends_on:
      - backend-migrate  # wartet auf Migrationen



  tika:
    image: apache/tika:2.5.0.2-full
    network_mode: host
    ports:
      - "9998:9998"
    environment:
      - TIKA_LOG_LEVEL=INFO

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7-0
    command: ["start-dev", "--http-enabled=true", "--http-port=8079", "--log-level=info", "--import-realm"]
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    environment:
      # Needed to create a config from scratch. Causing errors when using --import-realm
      # - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      # - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_FEATURES=persistent-user-sessions
    network_mode: host
    ports:
      - "8079:8079"

  storage:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: ["server", "/data", "--address", ":19000", "--console-address", ":8078"]
    environment:
      MINIO_ROOT_USER: "root"
      MINIO_ROOT_PASSWORD: "toortoor"
    network_mode: host
    volumes:
      - minio:/data

  chromadb:
    image: chromadb/chroma:0.6.3
    volumes:
      - ./chromadb:/chroma/chroma
    environment:
      - CHROMA_HOST_ADDR=127.0.0.1
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    network_mode: host
    ports:
      - "8000:8000"
 
volumes:
  data: {}
  pgdata: {}
  minio: {}
